<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stash</title>
<meta name="apple-mobile-web-app-title" content="Stash">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#5b6bff">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  // เปิดจากไอคอนบนหน้าจอโฮม → ไปที่เว็บแอปทันที
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwlqgV60UR_EQsi1f4mrYRv5rvogQbb4d3ZjEcURvxVK-lTmjI7sukENAOMoxPwXhDGrg/exec';
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) location.replace(APP_URL);
</script>
<style>
  :root { --bg: #f5f6fb; --card: #fff; --text: #1d1f2b; --muted: #6b6f80; --brand: #5b6bff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12131a; --card: #1d1f2b; --text: #f1f2f7; --muted: #a0a3b5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 380px; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(91,107,255,.35); }
  h1 { margin: 18px 0 4px; font-size: 28px; }
  p { margin: 0; color: var(--muted); }
  ol { text-align: left; background: var(--card); border-radius: 16px; padding: 18px 18px 18px 40px; margin: 24px 0; }
  li + li { margin-top: 8px; }
  a.btn { display: inline-block; background: var(--brand); color: #fff; text-decoration: none;
    padding: 12px 22px; border-radius: 12px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="">
  <h1>Stash</h1>
  <p>เพิ่มลงหน้าจอโฮม แล้วเปิดจากไอคอน</p>
  <ol>
    <li>แตะปุ่ม <b>แชร์</b> ด้านล่างของ Safari</li>
    <li>เลือก <b>เพิ่มไปยังหน้าจอโฮม</b></li>
    <li>แตะ <b>เพิ่ม</b> แล้วเปิดจากไอคอน Stash</li>
  </ol>
  <a class="btn" id="open" href="#">เปิดในเบราว์เซอร์</a>
</main>
<script>document.getElementById('open').href = APP_URL;</script>
</body>
</html>
